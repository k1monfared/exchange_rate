<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exchange_rate</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>exchange_rate</h1>
    <p class="sub">Iran free-market rates.</p>
  </header>

  <section id="calculator" class="card">
    <h2>Converter</h2>
    <div class="calc-flex">
      <div class="calendar-wrap">
        <div class="cal-head">
          <button id="cal-prev" type="button" aria-label="previous month">&lsaquo;</button>
          <button id="cal-title" type="button" class="cal-title" aria-haspopup="dialog"></button>
          <button id="cal-next" type="button" aria-label="next month">&rsaquo;</button>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
        <div class="cal-type"><button id="cal-toggle" type="button">Gregorian</button></div>
      </div>
      <div class="calc-right">
        <div class="calc-grid">
          <label>From
            <select id="calc-from"><option>USD</option><option>CAD</option><option>IRR</option></select>
          </label>
          <label>To
            <select id="calc-to"><option>IRR</option><option>USD</option><option>CAD</option></select>
          </label>
          <label>Rate source <select id="calc-source"></select></label>
          <label>Rate side
            <select id="calc-side"><option value="sell">sell</option><option value="buy">buy</option><option value="mid" selected>mid</option></select>
          </label>
          <label>Amount <input id="calc-amount" type="number" value="1"></label>
        </div>
        <p id="calc-result" class="calc-result">-</p>
        <p id="calc-provenance" class="provenance"></p>
      </div>
    </div>
  </section>

  <div class="layout">
    <aside class="sidebar">
      <div class="toggles-row"><span class="tk">currency</span><span id="currency-toggles" class="toggles"></span></div>
      <div class="toggles-row"><span class="tk">side</span><span id="side-toggles" class="toggles"></span></div>
      <div class="toggles-row"><span class="tk">source</span><span id="source-toggles" class="toggles"></span></div>
      <label class="side-check"><input type="checkbox" id="toggle-avg" checked> average (estimate)</label>
      <label>unit
        <select id="unit"><option value="toman">toman</option><option value="rial">rial</option></select>
      </label>
    </aside>
    <main class="content">
      <section id="tables" class="card"><h2 id="tables-title">Sources: rates to IRR, in toman</h2><div id="tables-body"></div></section>
      <section id="charts" class="card">
        <div class="chart-head">
          <h2>History</h2>
          <button id="reset-zoom" type="button">reset zoom</button>
        </div>
        <p class="sub">Drag the chart to pan, scroll or pinch to zoom. Y auto-fits.</p>
        <canvas id="main-chart" height="120"></canvas>
        <div class="zoom-ind">
          <div id="brush" class="brush">
            <div id="brush-window" class="brush-window">
              <div id="brush-left" class="brush-handle"></div>
              <div id="brush-right" class="brush-handle"></div>
            </div>
          </div>
          <div id="brush-label" class="brush-label"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="cal-modal" class="cal-modal">
    <form method="dialog" class="cal-modal-form">
      <h3>Select month and year</h3>
      <label>Month <select id="pick-month"></select></label>
      <label>Year <select id="pick-year"></select></label>
      <div class="cal-modal-actions">
        <button value="cancel" type="submit">Cancel</button>
        <button value="apply" type="submit" class="primary">Apply</button>
      </div>
    </form>
  </dialog>

  <div id="modal" class="modal hidden"><div class="modal-body"><button id="modal-close">close</button><div id="modal-content"></div></div></div>

  <script src="./vendor/chart.umd.min.js"></script>
  <script src="./vendor/hammer.min.js"></script>
  <script src="./vendor/chartjs-plugin-zoom.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
